<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPal Invoice Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="loginPage" class="container py-5">
  <h1>Login</h1>
  <form id="loginForm">
    <input type="text" class="form-control mb-2" placeholder="Username" id="username" required>
    <input type="password" class="form-control mb-2" placeholder="Password" id="password" required>
    <button class="btn btn-primary">Login</button>
  </form>
</div>

<div id="dashboardPage" style="display:none;">
  <div class="container py-5">
    <h1 class="mb-4">Dashboard</h1>

    <div class="row">
      <div class="col-md-6">
        <h4>Create Customer</h4>
        <form id="customerForm">
          <input type="text" class="form-control mb-2" placeholder="Name" id="name" required>
          <input type="email" class="form-control mb-2" placeholder="Email" id="email" required>
          <button class="btn btn-primary">Create Customer</button>
        </form>
      </div>

      <div class="col-md-6">
        <h4>Create Subscription</h4>
        <form id="subscriptionForm">
          <input type="number" class="form-control mb-2" placeholder="Customer ID" id="customer_id" required>
          <input type="text" class="form-control mb-2" placeholder="Description" id="description" required>
          <input type="number" step="0.01" class="form-control mb-2" placeholder="Price" id="price" required>
          <button class="btn btn-success">Create Subscription</button>
        </form>
      </div>
    </div>

    <hr>

    <h4>Send Invoice</h4>
    <form id="invoiceForm">
      <input type="number" class="form-control mb-2" placeholder="Customer ID" id="invoice_customer_id" required>
      <input type="number" class="form-control mb-2" placeholder="Subscription ID" id="invoice_subscription_id" required>
      <button class="btn btn-warning">Send Invoice</button>
    </form>

    <hr>

    <h4>Invoices</h4>
    <ul class="list-group" id="invoiceList"></ul>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
