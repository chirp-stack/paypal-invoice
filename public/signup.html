<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow p-5">
      <h2 class="text-primary mb-4 text-center">Create Admin Account</h2>

      <form id="signupForm">
        <input type="text" id="signupUsername" class="form-control mb-3" placeholder="Username" required>
        <input type="password" id="signupPassword" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      </form>

      <p class="text-center mt-3">
        Already have an account? <a href="dashboard.html">Go to Dashboard</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value;
      const password = document.getElementById('signupPassword').value;

      const res = await fetch('/api/register-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        const loginRes = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (loginRes.ok) {
          const data = await loginRes.json();
          localStorage.setItem('token', data.token);
          window.location.href = '/dashboard.html';
        } else {
          alert('Signup success, but login failed.');
          window.location.href = '/';
        }

      } else {
        alert('Signup failed: username may exist.');
      }
    });
  </script>
</body>
</html>
